[platformio]
default_envs = T3_S3_V1_2_SX1262
boards_dir = boards

[env]
build_flags = -Wno-deprecated-declarations # -Wno-error=deprecated-declarations for ArduinoJson
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600
montor_port = /dev/cu.usbmodem1201
upload_port = /dev/cu.usbmodem1201
monitor_filters =
	default
	esp32_exception_decoder
lib_deps = tzapu/WiFiManager@^2.0.17
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.4.1


[esp32s3_base]

build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; -UARDUINO_USB_CDC_ON_BOOT
    -DCORE_DEBUG_LEVEL=4

[env:T3_S3_V1_2_SX1262]
board = t3_s3_v1_x
build_flags = ${esp32s3_base.build_flags}
    -DT3_S3_V1_2_SX1262